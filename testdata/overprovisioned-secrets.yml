# VULNERABLE EXAMPLE for the "overprovisioned-secrets" rule, do not use it as a template.
# Run:    ./octoscan scan testdata/overprovisioned-secrets.yml
# expect: overprovisioned-secrets=6

# toJSON(secrets) and secrets[...] give a step every secret of the repository, even those it does not need. A single
# compromised action or injection leaks all of them (they are also masked only one by one in the logs).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: staging or production

env:
  # every secret in the environment of the whole workflow
  ALL_SECRETS: ${{ toJSON(secrets) }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [STAGING_TOKEN, PROD_TOKEN]
    steps:
      # in a script
      - run: echo '${{ toJSON(secrets) }}' > secrets.json

      # given to an action
      - uses: some-org/deploy-action@v1
        with:
          environment: ${{ toJSON(secrets) }}

      # chosen at run time: any secret can be selected
      - env:
          TOKEN: ${{ secrets[format('{0}_TOKEN', inputs.target)] }}
        run: ./deploy.sh
      - env:
          TOKEN: ${{ secrets[matrix.name] }}
        run: ./deploy.sh

      # the same through fromJSON
      - env:
          SECRETS: ${{ fromJSON(toJSON(secrets)) }}
        run: ./deploy.sh

  # not reported: a named secret
  named:
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          OTHER: ${{ secrets['OTHER_TOKEN'] }}
