# VULNERABLE EXAMPLE for the "credentials" rule, do not use it as a template.
# Run:    ./octoscan scan testdata/credentials.yml
# expect: credentials=3

# Hardcoded credentials of a container registry, in a workflow that anybody who can read the repository sees. This rule
# comes from actionlint.
name: Containers

on:
  push:

jobs:
  # the container of the job
  job:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/example-org/private-image:latest
      credentials:
        username: deploy-bot
        password: hunter2-do-not-do-this
    steps:
      - run: make

  # the services of the job
  services:
    runs-on: ubuntu-latest
    services:
      db:
        image: registry.example.com/postgres:16
        credentials:
          username: ci
          password: s3cr3t-ci-password
      cache:
        image: registry.example.com/redis:7
        credentials:
          username: ci
          password: another-hardcoded-password
    steps:
      - run: make test

  # not reported: the password comes from the secrets
  ok:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/example-org/private-image:latest
      credentials:
        username: deploy-bot
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - run: make
